<!DOCTYPE html>
<html manifest="505.manifest">
<head>
<meta charset="UTF-8">
<title>ASOGAMING PS4 Host</title>
<link rel="stylesheet" href="../style.css">
<style>
  body {
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
    background-size: cover;
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .glass-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    border-radius: 20px;
    padding: 40px;
    width: 80%;
    max-width: 700px;
  }

  h1 {
    font-size: 28px;
    margin: 10px 0 20px 0;
    letter-spacing: 1px;
    color: #f8fafc;
  }

  #msgs {
    font-size: 24px;
    margin-top: 20px;
    color: #38bdf8;
    font-weight: bold;
  }

  .footer-brand {
    margin-top: 30px;
    font-size: 22px;
    color: #cbd5e1;
    font-weight: bold;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>

<div class="glass-container">
    <h1>ASOGAMING PS4 Host</h1>
    <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.2); margin: 20px 0;">
    <div id="msgs">Starting Cache Installation...</div>
    <div class="footer-brand">ASOGAMING</div>
</div>

</body>
</html>
